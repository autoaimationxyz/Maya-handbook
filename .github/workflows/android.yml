name: Build Android app

# Builds MayaTraders.apk and attaches it to a GitHub Release.
# Content changes don't need a new APK (the app loads the live site);
# this only runs when the app shell, icons or this workflow change, or when started by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "assets/**"
      - "scripts/cap-config.js"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Check the signing key is set up
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD repository secrets (see README, step 3)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Configure app address
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          REPO="${GITHUB_REPOSITORY##*/}"
          APP_URL="https://$OWNER.github.io/$REPO/"
          node scripts/stamp.js "${GITHUB_SHA::7}" "$APP_URL"
          node scripts/cap-config.js "$APP_URL"

      - name: Create Android project
        run: npx cap add android

      - name: Icons and splash screen
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor "#15201C" --iconBackgroundColorDark "#15201C" --splashBackgroundColor "#15201C" --splashBackgroundColorDark "#15201C"

      - name: Sync
        run: npx cap sync android

      - name: Set version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign
        run: |
          echo "$KS_B64" | base64 -d > ks.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias maya --out MayaTraders.apk aligned.apk
          "$BT/apksigner" verify MayaTraders.apk
          rm -f ks.jks aligned.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: Maya Traders app 1.0.${{ github.run_number }}
          files: MayaTraders.apk
          make_latest: true
          body: |
            Open this page on your Android phone, tap **MayaTraders.apk** to download, then open it to install or update.
            Your data stays on the phone when you update. Make a backup from Notes first anyway.
